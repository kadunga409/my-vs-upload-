<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to cart - Wakibi Market</title>
    <meta http-equiv="refresh" content="0; url=cart.html">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
        .redirect-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 48px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        a {
            color: #0284c7;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h1>Redirecting to your cart…</h1>
        <p>If you are not redirected, <a href="cart.html">click here</a>.</p>
    </div>
</body>
</html>
